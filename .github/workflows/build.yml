name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Landscape + fullscreen
        run: |
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          sed -i 's#</style>#<item name="android:windowFullscreen">true</item></style>#' android/app/src/main/res/values/styles.xml
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arena-shooter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
